packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Security floors for transitive dependencies. Keep these until upstream
  # ranges include patched releases; CI verifies the resolved versions.
  "@hono/node-server": 2.0.10
  ioredis: 5.11.1
  "minimatch@3.1.5>brace-expansion": 5.0.9
  "minimatch@10.2.5>brace-expansion": 5.0.9
  dompurify: 3.4.13
  fast-uri: 3.1.5
  hono: 4.12.34
  ip-address: 10.3.1
  nanoid: 3.3.17
  postcss: 8.5.23
  sharp: 0.35.3
  shell-quote: 1.9.0
  valibot: 1.4.2
# pnpm v11 build-script approvals (map form); onlyBuiltDependencies kept for
# older pnpm compatibility.
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  core-js: false
  # Phase 7.7 C — @sentry/cli's postinstall downloads a native binary used
  # to upload source maps after each Next.js build (one-time ~10MB download
  # per fresh install). At build time the cli is invoked but the upload step
  # is silently skipped when SENTRY_AUTH_TOKEN is unset, so devs running
  # `pnpm build` locally without the token are unaffected.
  '@sentry/cli': true
minimumReleaseAgeExclude:
  - '@sentry/core@10.58.0'
  - '@sentry/node-core@10.58.0'
  - '@sentry/node@10.58.0'
  - '@sentry/opentelemetry@10.58.0'
  - '@sentry/server-utils@10.58.0'
  - '@sentry/browser-utils@10.58.0'
  - '@sentry/browser@10.58.0'
  - '@sentry/feedback@10.58.0'
  - '@sentry/nextjs@10.58.0'
  - '@sentry/react@10.58.0'
  - '@sentry/replay-canvas@10.58.0'
  - '@sentry/replay@10.58.0'
  - '@sentry/vercel-edge@10.58.0'
  - brace-expansion@5.0.9
  - dompurify@3.4.13
  - fast-uri@3.1.5
  - hono@4.12.34
  - ip-address@10.3.1
  - nanoid@3.3.17
  - postcss@8.5.23
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - msgpackr-extract
  - sharp
