# GuestPost.cc Render Blueprint
#
# Target environment: internal staging on guestpost.pro.bd.
# External infrastructure is intentionally bring-your-own:
# - Postgres: Neon
# - Redis: Upstash
# - Mail: Resend SMTP
# - Object storage: Cloudflare R2
#
# Do not place real credentials in this file. Values marked sync: false are
# filled in the Render Dashboard during Blueprint creation/sync.
# Database credentials belong only to the API and separately operated worker.
# Frontend builds receive only an unreachable non-secret Prisma-generation
# placeholder; the four frontend runtimes must never receive a real database
# credential.

previews:
  generation: "off"

services:
  - type: web
    name: guestpost-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: .
    # Schema-before-code release: promote manually only after migrations,
    # worker drain, runtime grants, issuer config, and cutover canaries pass.
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo build --filter=@guestpost/api...
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /api/v1/health
    domains:
      - api.guestpost.pro.bd
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: QUEUE_SIGNING_SECRET
        sync: false
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false
      - key: PAYOUT_ENCRYPTION_KEYS
        sync: false
      - key: PAYOUT_ENCRYPTION_ACTIVE_KEY_ID
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      # Financial releases start fail-closed. A reviewed cutover changes these
      # in the service dashboard only after migrations, incident queries, and
      # signed sandbox canaries pass.
      - key: FINANCE_RUNTIME_MODE
        value: recovery_only
      - key: PAYOUT_EXECUTION_ENABLED
        value: "false"
      # Server-only issuer identity. Render must receive the complete reviewed
      # set before the production API can boot or issue immutable documents.
      # The separately operated worker requires the exact same values; never
      # expose these through NEXT_PUBLIC_* variables.
      - key: INVOICE_DOCUMENT_PREFIX
        value: GP
      - key: INVOICE_ISSUER_LEGAL_NAME
        sync: false
      - key: INVOICE_ISSUER_ADDRESS_LINE_1
        sync: false
      - key: INVOICE_ISSUER_CITY
        sync: false
      - key: INVOICE_ISSUER_POSTAL_CODE
        sync: false
      - key: INVOICE_ISSUER_COUNTRY_CODE
        sync: false
      - key: INVOICE_SUPPORT_EMAIL
        sync: false
      - key: TRUSTED_ORIGINS
        value: https://guestpost.pro.bd,https://app.guestpost.pro.bd,https://publisher.guestpost.pro.bd,https://admin.guestpost.pro.bd,https://api.guestpost.pro.bd
      - key: CORS_ORIGIN
        value: https://guestpost.pro.bd,https://app.guestpost.pro.bd,https://publisher.guestpost.pro.bd,https://admin.guestpost.pro.bd
      - key: BETTER_AUTH_URL
        value: https://api.guestpost.pro.bd
      - key: AUTH_COOKIE_DOMAIN
        value: guestpost.pro.bd
      - key: API_BASE_URL
        value: https://api.guestpost.pro.bd/api/v1
      - key: NEXT_PUBLIC_API_URL
        value: https://api.guestpost.pro.bd
      - key: NEXT_PUBLIC_WEBSITE_URL
        value: https://guestpost.pro.bd
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://app.guestpost.pro.bd
      - key: NEXT_PUBLIC_PUBLISHER_URL
        value: https://publisher.guestpost.pro.bd
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://admin.guestpost.pro.bd
      - key: OAUTH_STATE_COOKIE_SAMESITE
        value: lax
      - key: OAUTH_STATE_COOKIE_SECURE
        value: "true"
      - key: PRISMA_POOL_MAX
        value: "10"
      - key: PLATFORM_FEE_PERCENT
        value: "20"
      # Pre-verification DoS budget for only the four canonical signed webhook
      # POST paths. This is not authentication; controller signatures remain
      # mandatory. Monitor provider 429/retry telemetry before tuning.
      - key: WEBHOOK_INGRESS_RATE_LIMIT_MAX
        value: "600"
      # Stripe credentials are supplied only in the Render Dashboard. New
      # money movement stays disabled until the migration, webhook, and
      # sandbox-certification gates in docs/STRIPE_STAGING_RUNBOOK.md pass.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Distinct least-privilege read credential for worker-side authenticated
      # deposit recovery. Configure the same value on the Northflank worker;
      # never reuse STRIPE_SECRET_KEY.
      - key: STRIPE_DEPOSIT_RECOVERY_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYOUT_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECTED_PAYOUT_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_DEPOSITS_ENABLED
        value: "false"
      - key: STRIPE_CONNECT_ENABLED
        value: "false"
      - key: STRIPE_LIVE_MODE_ENABLED
        value: "false"
      - key: PAYOUT_LEGACY_METHODS_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "2587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: GuestPost <noreply@guestpost.pro.bd>
      - key: OBJECT_STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: guestpost-dev
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"

  - type: web
    name: guestpost-portal
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: .
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo build --filter=@guestpost/portal...
    startCommand: cd apps/portal && npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    domains:
      - app.guestpost.pro.bd
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      # Workspace Prisma generation requires a syntactically valid URL even
      # though this application has no database runtime. Keep this non-secret,
      # loopback-only placeholder fail-closed in both build and runtime.
      - key: DATABASE_URL
        value: postgresql://build:build@127.0.0.1:5432/build
      - key: NEXT_PUBLIC_API_URL
        value: https://api.guestpost.pro.bd
      - key: NEXT_PUBLIC_WEBSITE_URL
        value: https://guestpost.pro.bd
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://app.guestpost.pro.bd
      - key: NEXT_PUBLIC_PUBLISHER_URL
        value: https://publisher.guestpost.pro.bd
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging

